async function open_(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.iv)},key,u(P.data));
const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close();}
async function tryOpen(pw,keep){try{await open_(pw);if(keep){try{localStorage.setItem(K,pw)}catch(e){}}return true}catch(e){return false}}
document.getElementById('go').onclick=async()=>{const ok=await tryOpen(document.getElementById('pw').value,document.getElementById('keep').checked);if(!ok)document.getElementById('err').textContent='パスワードが違います。'};
