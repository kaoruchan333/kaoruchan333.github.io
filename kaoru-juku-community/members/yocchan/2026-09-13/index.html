<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>9月13日の振り返り</title><style>:root{--ink:#222923;--deep:#263a32;--paper:#f7f5ef;--panel:#fff;--line:#d9d6cc;--gold:#b58a40;--green:#397359;--blue:#356d84;--muted:#68716c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;letter-spacing:0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);line-height:1.85}.hero{padding:42px 0;background:var(--deep);color:#fff;border-bottom:5px solid var(--gold)}.wrap{width:min(920px,calc(100% - 32px));margin:auto}.hero h1{margin:8px 0;font-size:clamp(29px,5vw,48px);line-height:1.35}.hero p{margin:0;color:#dfe8e2}.eyebrow{font-size:12px;font-weight:800;color:#d6c18e}.back{display:inline-block;margin-bottom:12px;color:#ddcc9f;text-decoration:none;font-size:13px}main{padding:28px 0 80px}article{padding:clamp(20px,4vw,42px);background:var(--panel);border:1px solid var(--line);border-radius:7px}h1,h2,h3{color:var(--deep);line-height:1.45}article h1{font-size:clamp(27px,4vw,40px);margin-top:0}article h2{margin-top:42px;padding-top:14px;border-top:1px solid var(--line);font-size:25px}article h3{margin-top:30px;font-size:19px}blockquote{margin:20px 0;padding:14px 18px;border-left:5px solid var(--gold);background:#f8f1e4}pre{white-space:pre-wrap;padding:18px;background:#24322d;color:#f6f6f0;border-radius:6px;overflow:auto}code{overflow-wrap:anywhere}li{margin:7px 0}.notice{margin-bottom:18px;padding:14px 17px;border:1px solid #ddcda9;background:#fbf3e3;border-radius:5px;font-size:13px;color:#6e5428}a{color:#28634d}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.button{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:5px;background:var(--deep);color:#fff;text-decoration:none;font-weight:800}.button.alt{background:#fff;color:var(--deep);border:1px solid #9eb2a8}body.locked>*:not(#gate),body.kj-auth-locked>*:not(#kj-auth-overlay){display:none!important}#gate,#kj-auth-overlay{position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:20px;background:var(--deep)}.gatebox,.auth{width:min(420px,100%);padding:28px;background:#fff;border-radius:8px}.gatebox input,.gatebox button,.auth input,.auth button{width:100%;min-height:46px;margin-top:10px;padding:10px;font-size:16px}.gatebox button,.auth button{border:0;background:var(--deep);color:#fff;font-weight:800}@media(max-width:640px){.hero{padding:30px 0}article{padding:18px}.actions{display:grid}.button{width:100%}}</style></head><body class="locked"><header class="hero"><div class="wrap"><a class="back" href="../">よっちゃんの記録へ</a><div class="eyebrow">2026.09.13 KAORU JUKU</div><h1>9月13日の振り返り</h1><p>よっちゃん本人専用</p></div></header><main class="wrap"><article><h1>一つの「苦手」が、二つに分かれた</h1><p>今回の対話で見えた現在地と、続きを自分のペースで確かめるワークをまとめました。</p><div class="actions"><a class="button" href="current-state/">心の整体・現在地を見る</a><a class="button alt" href="workbook/">個別実践ワークを開く</a></div><h2>今回確認できたこと</h2><blockquote>「何も出てこない方」と、「文字がつながらない方」は別。</blockquote><p>これは答えではなく、混ざっていた工程を分けられた今回の到達点です。未確認の場所は、できていない場所ではありません。これから一緒に確かめる場所です。</p></article></main><script>(function(){const H='1d3327e0df4257470c17e90db4c8651c840277973efc58a7ee5943f86c279b7b',K='kaoru_juku_member_yocchan_auth_v2';async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function open(){document.body.classList.remove('locked');document.getElementById('gate')?.remove()}if(localStorage.getItem(K)===H)return open();const d=document.createElement('div');d.id='gate';d.innerHTML='<div class="gatebox"><h2>よっちゃん本人専用</h2><p>いつものパスワードを入力してください。</p><input id="pw" type="password" autocomplete="current-password"><button id="go">表示する</button><div id="er"></div></div>';document.body.appendChild(d);async function go(){if(await hash(document.getElementById('pw').value)===H){localStorage.setItem(K,H);open()}else document.getElementById('er').textContent='パスワードが違います。'}document.getElementById('go').onclick=go;document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go()}})();</script></body></html>
