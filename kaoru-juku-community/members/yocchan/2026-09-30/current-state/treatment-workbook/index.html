<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex,nofollow'><title>Y6 言葉の解剖</title><style>
:root{--ink:#26302b;--deep:#24382f;--paper:#f5f3ed;--panel:#fff;--line:#d9d5ca;--gold:#b88942;--green:#38745a;--blue:#3f6f82;--muted:#68716d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;line-height:1.9;letter-spacing:0}body.locked>*:not(#gate){display:none!important}.wrap{width:min(940px,calc(100% - 30px));margin:auto}.hero{padding:44px 0;background:var(--deep);color:#fff;border-bottom:5px solid var(--gold)}.hero h1{margin:8px 0;font-size:clamp(31px,6vw,53px);line-height:1.3}.hero p{max-width:760px;color:#e0e8e3}.eyebrow{font-size:12px;font-weight:900;color:#dbc58f}.back{color:#dbc58f;text-decoration:none}main{padding:28px 0 80px}section{margin:0 0 20px;padding:clamp(20px,4vw,36px);background:var(--panel);border:1px solid var(--line);border-radius:7px}h2{margin:0 0 16px;font-size:clamp(23px,4vw,32px);line-height:1.45}h3{line-height:1.5}.leadbox{background:#edf4f0;border-left:6px solid var(--green)}.quote{padding:16px;background:#f1eee6;border-left:5px solid var(--gold);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{padding:20px;background:#faf9f5;border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:6px}.fact{border-top-color:var(--green)}.open{border-top-color:var(--blue)}.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.chain span{padding:9px 12px;background:var(--deep);color:#fff;border-radius:4px;font-size:13px}.chain i{font-style:normal;color:var(--gold);font-weight:900}.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 15px;border-radius:5px;background:var(--gold);color:#1f2a24;text-decoration:none;font-weight:900}.small{color:var(--muted);font-size:13px}.note{padding:16px;border:1px solid #d8cba9;background:#fffaf0}.resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.resource{padding:18px;border:1px solid var(--line);border-radius:6px;background:#faf9f5}.resource strong{display:block}.choice{display:block;margin:9px 0;padding:13px;border:1px solid var(--line);border-radius:5px;background:#fff}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #bab6aa;border-radius:5px;font:inherit}button{min-height:44px;padding:10px 15px;border:0;border-radius:5px;background:var(--deep);color:#fff;font-weight:800}#gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:var(--deep)}.gatebox{width:min(420px,100%);padding:28px;background:#fff;border-radius:8px}.gatebox input,.gatebox button{width:100%;min-height:46px;margin-top:10px;padding:10px;font-size:16px}@media(max-width:700px){.grid,.resource-grid{grid-template-columns:1fr}.chain{display:grid;grid-template-columns:1fr}.chain i{text-align:center;transform:rotate(90deg)}}
</style></head><body class='locked'><header class='hero'><div class='wrap'><p class='eyebrow'>KAORU JUKU / 2026.09.30</p><h1>Y6 一点手当て<br>正解と進むを分ける</h1><p>フレームワークを自分で作らず、二つの言葉の意味を選んで確かめます。</p></div></header><main class='wrap'>
<section class='leadbox'><h2>今回は言葉の解剖だけ</h2><p>反対側や価値観にはまだ進みません。「正解」「進む」が何を指すかを選んだら終了です。</p></section>
<section><h2>1. 一場面</h2><p>自分の言葉をコーチが復唱し、「こういうことですか」と聞いた場面です。</p><p>この場面で合っていますか？</p><label class='choice'><input type='radio' name='scene' value='合っている'>合っている</label><label class='choice'><input type='radio' name='scene' value='一部違う'>一部違う</label><label class='choice'><input type='radio' name='scene' value='違う'>違う</label><label class='choice'><input type='radio' name='scene' value='分からない'>分からない</label></section>
<section><h2>2. 「正解になる」に近いもの</h2><label class='choice'><input type='radio' name='correct' value='後から直せなくなる'>後から直せなくなる</label><label class='choice'><input type='radio' name='correct' value='相手に自分の意味を決められる'>相手に自分の意味を決められる</label><label class='choice'><input type='radio' name='correct' value='自分でも本当だと思い込んでしまう'>自分でも本当だと思い込んでしまう</label><label class='choice'><input type='radio' name='correct' value='正しい答えとして採点される'>正しい答えとして採点される</label><label class='choice'><input type='radio' name='correct' value='どれも違う'>どれも違う</label><label class='choice'><input type='radio' name='correct' value='分からない'>分からない</label></section>
<section><h2>3. 「進む」に近いもの</h2><label class='choice'><input type='radio' name='advance' value='次の質問へ移る'>次の質問へ移る</label><label class='choice'><input type='radio' name='advance' value='その言葉を前提に話が続く'>その言葉を前提に話が続く</label><label class='choice'><input type='radio' name='advance' value='自分が訂正する機会を失う'>自分が訂正する機会を失う</label><label class='choice'><input type='radio' name='advance' value='相手が分かったと思う'>相手が分かったと思う</label><label class='choice'><input type='radio' name='advance' value='どれも違う'>どれも違う</label><label class='choice'><input type='radio' name='advance' value='分からない'>分からない</label></section>
<section><h2>4. 仮の返し方</h2><p>今なら一番使いやすいものを一つだけ。</p><label class='choice'><input type='radio' name='reply' value='七割ぐらい近い'>七割ぐらい近い</label><label class='choice'><input type='radio' name='reply' value='一部は近いけれど、まだ違う'>一部は近いけれど、まだ違う</label><label class='choice'><input type='radio' name='reply' value='今は分からない。仮置きで進みたい'>今は分からない。仮置きで進みたい</label><label class='choice'><input type='radio' name='reply' value='後で直してもいいですか'>後で直してもいいですか</label><label class='choice'><input type='radio' name='reply' value='どれも使いにくい'>どれも使いにくい</label></section>
<section><h2>補足</h2><textarea id='note' placeholder='違いがあれば一言だけ。空欄でも大丈夫です。'></textarea><button id='copy'>回答をまとめてコピー</button><p id='done' class='small'></p></section>
<script>document.getElementById('copy').onclick=async()=>{const one=n=>document.querySelector(`[name="${n}"]:checked`)?.value||'未回答';const t=`【よっちゃん・9月30日 Y6言葉の解剖】
場面：${one('scene')}
正解になる：${one('correct')}
進む：${one('advance')}
仮の返し方：${one('reply')}
補足：${document.getElementById('note').value||'なし'}`;await navigator.clipboard.writeText(t);document.getElementById('done').textContent='コピーしました。ここまでで終了です。';}</script>
</main><div id='gate'><div class='gatebox'><p class='eyebrow'>PRIVATE PAGE</p><h2>よっちゃん本人専用</h2><p>パスワードを入力してください。</p><input id='pw' type='password'><button id='unlock'>開く</button><p id='er'></p></div></div><script>const HASH='1d3327e0df4257470c17e90db4c8651c840277973efc58a7ee5943f86c279b7b',KEY='kaoru_juku_member_yocchan_auth_v2';async function h(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function op(){if(await h(document.getElementById('pw').value)===HASH){localStorage.setItem(KEY,'1');document.body.classList.remove('locked');document.getElementById('gate').remove()}else document.getElementById('er').textContent='パスワードが違います'}document.getElementById('unlock').onclick=op;document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')op()};if(localStorage.getItem(KEY)==='1'){document.body.classList.remove('locked');document.getElementById('gate').remove()}</script></body></html>
