<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex,nofollow'><title>よっちゃん 一問ワーク 10月4日</title><style>
:root{--ink:#24302b;--deep:#18382f;--paper:#f3f1ea;--panel:#fff;--line:#d5d2c8;--gold:#c49a52;--green:#367259;--blue:#416f7e;--muted:#66716b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;line-height:1.9;letter-spacing:0}body.locked>*:not(#gate){display:none!important}.wrap{width:min(940px,calc(100% - 28px));margin:auto}.hero{padding:42px 0;background:var(--deep);color:#fff;border-bottom:5px solid var(--gold)}.hero h1{font-size:clamp(30px,6vw,50px);line-height:1.35;margin:8px 0}.hero p{max-width:760px}.eyebrow{font-size:12px;font-weight:900;color:#e4cf99}main{padding:26px 0 78px}section{margin:0 0 18px;padding:clamp(20px,4vw,34px);background:var(--panel);border:1px solid var(--line);border-radius:7px}h2{font-size:clamp(22px,4vw,31px);line-height:1.45;margin:0 0 14px}.lead{border-left:6px solid var(--green);background:#edf4f0}.quote{padding:16px;border-left:5px solid var(--gold);background:#f5f1e7;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:18px;border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:6px;background:#faf9f5}.fact{border-top-color:var(--green)}.open{border-top-color:var(--blue)}.steps{display:grid;gap:10px}.step{padding:14px 16px;border-left:5px solid var(--green);background:#f7faf8}.button,button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 15px;border:0;border-radius:5px;background:var(--deep);color:#fff;text-decoration:none;font-weight:800}.secondary{background:var(--gold);color:#1c2924}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #aaa69c;border-radius:5px;font:inherit}.small{font-size:13px;color:var(--muted)}#gate{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:var(--deep);z-index:10}.gatebox{width:min(420px,100%);padding:26px;background:#fff;border-radius </style></head><body class='locked'><header class='hero'><div class='wrap'><p class='eyebrow'>KAORU JUKU / 2026.10.04</p><h1>一問だけ、<br>感じてみる</h1><p>温度が分かれば温度から。分からなければ、分からないをそのまま残します。</p></div></header><main class='wrap'>
<section class='lead'><h2>今日は一問で終わりです</h2><p>今、手でも足でも、どこでも大丈夫です。温かい・冷たいがあれば一つだけ選びます。何も分からなくても大丈夫です。</p></section>
<section><h2>いま分かるものを一つ</h2><label><input type='radio' name='q' value='温かい'> 温かい</label><br><label><input type='radio' name='q' value='冷たい'> 冷たい</label><br><label><input type='radio' name='q' value='どちらも分からない'> どちらも分からない</label><br><label><input type='radio' name='q' value='質問の意味が分からない'> 質問の意味が分からない</label><p class='small'>触っている／触られている、まで分けなくて大丈夫です。</p></section>
<section><h2>最後に、この一文だけ</h2><p class='quote'>「いま、そう感じている私がいる」</p><textarea id='memo' placeholder='何も書かなくても終われます'></textarea><p><button onclick='save()'>回答をまとめてコピー</button></p><pre id='out'></pre></section>
<script>async function save(){const q=document.querySelector('input[name=q]:checked')?.value||'未選択';const t=`【10月4日 観測者の一問ワーク】
温度：${q}
一言メモ：${memo.value||'なし'}`;localStorage.setItem('yocchan_20261004_workbook',t);out.textContent=t;try{await navigator.clipboard.writeText(t)}catch(e){} }</script>
</main><div id='gate'><div class='gatebox'><p class='eyebrow'>PRIVATE PAGE</p><h2>よっちゃん本人専用</h2><p>パスワードを入力してください。</p><input id='pw' type='password'><button id='unlock'>開く</button><p id='er'></p></div></div><script>const H='1d3327e0df4257470c17e90db4c8651c840277973efc58a7ee5943f86c279b7b',K='kaoru_juku_member_yocchan_auth_v2';async function x(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return[...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,'0')).join('')}async function o(){if(await x(pw.value)===H){localStorage.setItem(K,'1');document.body.classList.remove('locked');gate.remove()}else er.textContent='パスワードが違います'}unlock.onclick=o;pw.onkeydown=e=>{if(e.key==='Enter')o()};if(localStorage.getItem(K)==='1'){document.body.classList.remove('locked');gate.remove()}</script></body></html>
